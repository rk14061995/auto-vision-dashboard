<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon & icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport & theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary SEO -->
    <title>AutoVision Pro — Car Customization Studio</title>
    <meta name="description" content="AutoVision Pro is a virtual car customization studio. Upload your car photo to paint parts, add stickers, logos, and text — or explore stunning 3D models." />
    <meta name="keywords" content="car customization, virtual car studio, car paint simulator, 3D car viewer, auto design, car wrap, car stickers" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AutoVision Pro" />
    <link rel="canonical" href="https://autovision-pro.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://autovision-pro.com/" />
    <meta property="og:title" content="AutoVision Pro — Car Customization Studio" />
    <meta property="og:description" content="Paint, wrap, and accessorize your car virtually. Upload a photo or explore 3D models — no download required." />
    <meta property="og:image" content="https://autovision-pro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="AutoVision Pro" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AutoVision Pro — Car Customization Studio" />
    <meta name="twitter:description" content="Paint, wrap, and accessorize your car virtually. Upload a photo or explore 3D models — no download required." />
    <meta name="twitter:image" content="https://autovision-pro.com/og-image.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AutoVision Pro",
      "url": "https://autovision-pro.com/",
      "description": "Virtual car customization studio — paint parts, add stickers & logos, or explore 3D car models.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "AutoVision Pro"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run AutoVision Pro.</noscript>
    <div id="root"></div>
  </body>
</html>
